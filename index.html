<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Download - Watch & Download Anime HD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #f8fafc; padding-bottom: 40px; }
    
    /* Header & Navigation */
    header { background: #151d30; padding: 15px 20px; border-bottom: 1px solid #1e293b; sticky: top: 0; z-index: 100; position: sticky; top: 0; }
    .header-container { max-width: 1100px; margin: auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .logo { font-size: 20px; font-weight: 800; color: #38bdf8; text-decoration: none; display: flex; align-items: center; gap: 6px; }
    
    .search-box { flex: 1; max-width: 400px; position: relative; }
    .search-box input { width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #1e293b; background: #0b0f19; color: #fff; font-size: 14px; outline: none; }
    .search-box input:focus { border-color: #38bdf8; }

    /* Container & Category Tags */
    .container { max-width: 1100px; margin: 20px auto; padding: 0 15px; }
    .cat-tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-tag { background: #151d30; color: #94a3b8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; border: 1px solid #1e293b; transition: 0.3s; }
    .cat-tag.active, .cat-tag:hover { background: #0284c7; color: #fff; border-color: #0284c7; }

    /* Anime Grid Layout */
    .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    @media (min-width: 640px) { .anime-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; } }

    .anime-card { background: #151d30; border-radius: 12px; overflow: hidden; border: 1px solid #1e293b; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; position: relative; display: flex; flex-direction: column; }
    .anime-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-color: #38bdf8; }
    
    .poster-wrapper { width: 100%; aspect-ratio: 2/3; position: relative; background: #0b0f19; overflow: hidden; }
    .poster-img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-container { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; }
    .badge { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: bold; padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .badge.pin { background: #f59e0b; color: #000; }
    .blue-tick { display: inline-block; width: 16px; height: 16px; background: #38bdf8; color: #0b0f19; border-radius: 50%; text-align: center; line-height: 16px; font-size: 10px; font-weight: bold; position: absolute; top: 8px; right: 8px; }

    .anime-info { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .anime-title { font-size: 13px; font-weight: 700; color: #f8fafc; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .anime-meta { font-size: 11px; color: #38bdf8; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

    /* Detail Modal View */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px; opacity: 0; pointer-events: none; transition: 0.3s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .modal-content { background: #151d30; border: 1px solid #1e293b; border-radius: 16px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
    .close-btn { position: absolute; top: 15px; right: 15px; background: #1e293b; color: #fff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .modal-header { display: flex; gap: 15px; margin-bottom: 15px; }
    .modal-poster { width: 100px; height: 140px; border-radius: 8px; object-fit: cover; border: 1px solid #38bdf8; flex-shrink: 0; }
    .modal-details h3 { font-size: 18px; color: #38bdf8; margin-bottom: 6px; }
    .modal-details p { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    
    .synopsis-box { background: #0b0f19; padding: 10px; border-radius: 8px; font-size: 12px; color: #cbd5e1; line-height: 1.5; margin-bottom: 15px; border: 1px solid #1e293b; }
    
    .ep-list-title { font-size: 14px; font-weight: bold; color: #38bdf8; margin-bottom: 10px; }
    .ep-card { background: #0b0f19; border: 1px solid #1e293b; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .ep-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .ep-name { font-size: 13px; font-weight: bold; color: #f8fafc; }
    .ep-date { font-size: 11px; color: #64748b; }
    
    .dl-btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .dl-link-btn { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; transition: 0.2s; display: inline-block; }
    .dl-link-btn:hover { opacity: 0.9; transform: scale(1.02); }

    .no-data { text-align: center; padding: 40px; color: #64748b; font-size: 14px; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-container">
      <a href="#" class="logo">🎬 Anime Download HD</a>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="এনিমেশনের নাম লিখে খুঁজুন..." oninput="handleSearch()">
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="container">
    <!-- Category Filter Tags -->
    <div class="cat-tags" id="cat-tags-container">
      <div class="cat-tag active" onclick="filterCategory('ALL', this)">All Anime</div>
      <div class="cat-tag" onclick="filterCategory('Hindi Dub', this)">Hindi Dub</div>
      <div class="cat-tag" onclick="filterCategory('English Dub', this)">English Dub</div>
      <div class="cat-tag" onclick="filterCategory('Action', this)">Action</div>
      <div class="cat-tag" onclick="filterCategory('Romance', this)">Romance</div>
      <div class="cat-tag" onclick="filterCategory('Adventure', this)">Adventure</div>
      <div class="cat-tag" onclick="filterCategory('Fantasy', this)">Fantasy</div>
      <div class="cat-tag" onclick="filterCategory('Movies', this)">Movies</div>
    </div>

    <!-- Anime Grid -->
    <div class="anime-grid" id="anime-grid-container">
      <div class="no-data">এনিমেশন পোস্ট লোড হচ্ছে...</div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="anime-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div class="modal-header">
        <img src="" id="modal-poster" class="modal-poster" alt="Poster">
        <div class="modal-details">
          <h3 id="modal-title">Anime Title</h3>
          <p id="modal-type-year">Type • Year</p>
          <p id="modal-rating">⭐ Rating</p>
          <p id="modal-lang">🎙️ Language</p>
          <p id="modal-cats" style="color: #38bdf8;">Genres</p>
        </div>
      </div>
      <div class="synopsis-box" id="modal-synopsis">Synopsis goes here...</div>
      
      <div class="ep-list-title">📥 ডাউনলোড ও ওয়াচ লিংকসমূহ:</div>
      <div id="modal-episodes-list"></div>
    </div>
  </div>

  <!-- Firebase Integration & Live Visitor Tracking -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onDisconnect, set, update, increment, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBZPX85Wl0-vBE7Vm1NBuVoiBzVmp9xU0o",
      authDomain: "moviebox-6dca4.firebaseapp.com",
      databaseURL: "https://moviebox-6dca4-default-rtdb.firebaseio.com",
      projectId: "moviebox-6dca4",
      storageBucket: "moviebox-6dca4.firebasestorage.app",
      messagingSenderId: "573703773546",
      appId: "1:573703773546:web:04f01416cba5ff483ad913"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let allMoviesList = [];
    let currentCategory = "ALL";

    // 🌐 1. Live Visitor & Traffic Analytics Tracking
    function initVisitorTracking() {
      const userRef = push(ref(db, 'analytics/liveUsers'));
      set(userRef, true);
      onDisconnect(userRef).remove();

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;

      if (!sessionStorage.getItem('visited_today')) {
        sessionStorage.setItem('visited_today', 'true');
        
        const updates = {};
        updates[`analytics/totalViews`] = increment(1);
        updates[`analytics/daily/${todayStr}`] = increment(1);

        let refUrl = document.referrer.toLowerCase();
        let sourceName = "Direct (সরাসরি লিংক)";

        if (refUrl.includes("google")) sourceName = "Google Search";
        else if (refUrl.includes("t.me") || refUrl.includes("telegram")) sourceName = "Telegram";
        else if (refUrl.includes("facebook") || refUrl.includes("fb")) sourceName = "Facebook";
        else if (refUrl.includes("youtube")) sourceName = "YouTube";
        else if (refUrl) sourceName = "Other Website";

        updates[`analytics/sources/${sourceName}`] = increment(1);

        fetch('https://api.country.is/')
          .then(res => res.json())
          .then(data => {
            let cCode = data.country || "BD";
            const countryMap = {
              "BD": "Bangladesh 🇧🇩",
              "IN": "India 🇮🇳",
              "US": "United States 🇺🇸",
              "SA": "Saudi Arabia 🇸🇦",
              "AE": "UAE 🇦🇪",
              "PK": "Pakistan 🇵🇰",
              "MY": "Malaysia 🇲🇾",
              "GB": "United Kingdom 🇬🇧"
            };
            let countryName = countryMap[cCode] || `Country (${cCode})`;
            updates[`analytics/countries/${countryName}`] = increment(1);
            update(ref(db), updates);
          })
          .catch(() => {
            updates[`analytics/countries/Bangladesh 🇧🇩`] = increment(1);
            update(ref(db), updates);
          });
      }
    }

    // 🎬 2. Load Movies from Firebase
    function loadAnimeData() {
      onValue(ref(db, 'movies'), (snapshot) => {
        allMoviesList = [];
        if (snapshot.exists()) {
          snapshot.forEach(child => {
            allMoviesList.push({ id: child.key, ...child.val() });
          });

          // Sort Pinned Posts Top, then by timestamp
          allMoviesList.sort((a, b) => {
            if ((b.isPinned ? 1 : 0) !== (a.isPinned ? 1 : 0)) {
              return (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0);
            }
            return (b.timestamp || 0) - (a.timestamp || 0);
          });
        }
        renderAnimeGrid(allMoviesList);
      });
    }

    // Render Grid Cards
    function renderAnimeGrid(list) {
      const container = document.getElementById('anime-grid-container');
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<div class="no-data">কোনো এনিমেশন পাওয়া যায়নি!</div>`;
        return;
      }

      list.forEach(item => {
        const posterUrl = item.poster || 'https://i.ibb.co.com/ZpcSQ5d6/file-00000000ce2482118efd27c261ce5495.png';
        const isPinned = item.isPinned ? `<span class="badge pin">📌 PINNED</span>` : '';
        const blueTick = item.isVerified ? `<span class="blue-tick" title="Verified Direct Links">✓</span>` : '';
        
        const card = document.createElement('div');
        card.className = 'anime-card';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${posterUrl}" class="poster-img" alt="${item.title}" onerror="this.src='https://i.ibb.co.com/ZpcSQ5d6/file-00000000ce2482118efd27c261ce5495.png';">
            <div class="badge-container">${isPinned}</div>
            ${blueTick}
          </div>
          <div class="anime-info">
            <div class="anime-title">${item.title}</div>
            <div class="anime-meta">
              <span>⭐ ${item.rating || '9.0'}</span>
              <span>${item.year || '2026'}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Category Filter Function
    window.filterCategory = function(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
      element.classList.add('active');

      if (cat === 'ALL') {
        renderAnimeGrid(allMoviesList);
      } else {
        const filtered = allMoviesList.filter(m => {
          if (Array.isArray(m.category)) return m.category.includes(cat);
          return m.category && m.category.includes(cat);
        });
        renderAnimeGrid(filtered);
      }
    };

    // Search Function
    window.handleSearch = function() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allMoviesList.filter(m => 
        m.title.toLowerCase().includes(query) ||
        (m.keywords && m.keywords.toLowerCase().includes(query))
      );
      renderAnimeGrid(filtered);
    };

    // Modal Details Display
    window.openModal = function(item) {
      document.getElementById('modal-poster').src = item.poster || '';
      document.getElementById('modal-title').innerText = item.title;
      document.getElementById('modal-type-year').innerText = `${item.type || 'Anime'} • ${item.year || '2026'}`;
      document.getElementById('modal-rating').innerText = `⭐ Rating: ${item.rating || 'N/A'}`;
      document.getElementById('modal-lang').innerText = `🎙️ Language: ${item.language || 'Dual Audio'}`;
      
      const catText = Array.isArray(item.category) ? item.category.join(', ') : item.category;
      document.getElementById('modal-cats').innerText = `🏷️ ${catText || 'Anime'}`;
      document.getElementById('modal-synopsis').innerText = item.synopsis || 'কোনো সংক্ষিপ্ত বিবরণ দেওয়া নেই।';

      const epContainer = document.getElementById('modal-episodes-list');
      epContainer.innerHTML = "";

      if (item.episodes && item.episodes.length > 0) {
        item.episodes.forEach(ep => {
          const epCard = document.createElement('div');
          epCard.className = 'ep-card';
          
          let btnHtml = "";
          if (ep.qualities && ep.qualities.length > 0) {
            ep.qualities.forEach(q => {
              btnHtml += `<a href="${q.url}" target="_blank" class="dl-link-btn">⬇️ ${q.label}</a>`;
            });
          }

          epCard.innerHTML = `
            <div class="ep-card-header">
              <span class="ep-name">${ep.episodeName}</span>
              <span class="ep-date">${ep.date || ''}</span>
            </div>
            <div class="dl-btn-group">${btnHtml}</div>
          `;
          epContainer.appendChild(epCard);
        });
      } else {
        epContainer.innerHTML = `<p style="color:#94a3b8; font-size:12px;">কোনো এপিসোড লিংক পাওয়া যায়নি।</p>`;
      }

      document.getElementById('anime-modal').classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('anime-modal').classList.remove('active');
    };

    // Run Initialization
    initVisitorTracking();
    loadAnimeData();
  </script>
</body>
    </html>
