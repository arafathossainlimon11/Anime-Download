<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret Admin Panel - Anime Download</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; padding: 15px; }
    .container { max-width: 650px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-bottom: 20px; color: #38bdf8; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    button:hover { background: #1d4ed8; }
    
    /* Analytics Dashboard Grid */
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-card.full-width { grid-column: span 2; border-color: #38bdf8; background: #111e38; }
    .stat-num { font-size: 20px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    .stat-label { font-size: 12px; color: #94a3b8; font-weight: 600; }

    .admin-device-badge {
      background: #065f46;
      color: #34d399;
      border: 1px solid #059669;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

    /* Multiple Category Checkbox Grid */
    .category-checkbox-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .cat-check-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #cbd5e1;
      cursor: pointer;
      font-weight: 500;
    }
    .cat-check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #0284c7;
      cursor: pointer;
    }

    /* Episode Box Styling */
    .ep-box { background: #0f172a; border: 1px solid #38bdf8; border-radius: 10px; padding: 15px; margin-top: 15px; }
    .ep-header-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .ep-header-row input[type="text"] { flex: 2; font-weight: bold; color: #38bdf8; }
    .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #ef4444; cursor: pointer; white-space: nowrap; font-weight: bold; }
    .checkbox-label.tg-ep-label { color: #229ed9; }
    .checkbox-label input { width: auto; }

    /* Quality Row Styling */
    .quality-container { background: #1e293b; border-radius: 8px; padding: 10px; margin-top: 10px; }
    .quality-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
    .quality-row input { flex: 1; }
    .btn-remove-q { background: #dc2626; color: #fff; border: none; border-radius: 4px; padding: 8px 12px; cursor: pointer; font-size: 12px; width: auto; margin: 0; }
    
    .btn-add-q { background: #0284c7; font-size: 12px; padding: 8px 12px; width: auto; margin-top: 5px; }
    .btn-add-ep { background: #059669; margin-top: 15px; }
    .btn-add-ep:hover { background: #047857; }
    .btn-remove-ep { background: #b91c1c; font-size: 12px; padding: 6px 12px; width: auto; margin-top: 10px; }
    .btn-cancel { background: #64748b; margin-top: 5px; }
    
    .login-box { max-width: 350px; margin: 100px auto; background: #1e293b; padding: 25px; border-radius: 10px; text-align: center; }
    .hidden { display: none; }
    
    /* Published Items & Search Styling */
    .movie-list { margin-top: 30px; border-top: 2px dashed #334155; padding-top: 20px; }
    .admin-search-input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      margin-bottom: 15px;
      outline: none;
    }
    .admin-search-input:focus {
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }
    
    .total-posts-badge {
      background: #0284c7;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 10px;
    }

    /* Movie Item with Thumbnail */
    .movie-item { 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      gap: 8px; 
      background: #0f172a; 
      padding: 10px; 
      margin-top: 8px; 
      border-radius: 8px; 
      border: 1px solid #334155; 
    }
    .admin-item-info {
      flex: 1;
      overflow: hidden;
      padding-right: 4px;
    }
    .admin-thumb-img {
      width: 45px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      border: 1px solid #38bdf8;
      background: #1e293b;
    }
    .action-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .btn-bump { background: #0284c7; padding: 6px 8px; font-size: 11px; width: auto; margin: 0; }
    .btn-edit { background: #d97706; padding: 6px 8px; font-size: 11px; width: auto; margin: 0; }
    .btn-delete { background: #dc2626; padding: 6px 8px; font-size: 11px; width: auto; margin: 0; }

    /* Badges */
    .blue-tick {
      display: inline-block;
      width: 16px;
      height: 16px;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 50%;
      text-align: center;
      line-height: 16px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 2px;
    }
    .pin-tag {
      color: #f59e0b;
      font-weight: bold;
      font-size: 12px;
      margin-left: 2px;
    }
    
    .btn-auto-kw {
      background: linear-gradient(135deg, #d97706, #f59e0b);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      width: auto;
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <!-- গোপন লগইন সেকশন -->
  <div id="login-section" class="login-box">
    <h2>Anime Admin Login</h2>
    <div class="form-group">
      <input type="password" id="admin-pass" placeholder="পাসওয়ার্ড লিখুন" autocomplete="off">
    </div>
    <button onclick="login()">Login</button>
  </div>

  <!-- মূল এডমিন ড্যাশবোর্ড -->

    <h2>Anime Download Admin Panel</h2>
    
    <div class="admin-device-badge">

    <!-- Realtime Analytics Dashboard -->
    <div class="analytics-grid">
      <div class="stat-card full-width">

        <div class="stat-num" id="stat-live" style="color: #10b981;">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">📊 আজকের ভিজিটর</div>

      </div>
      <div class="stat-card">
        <div class="stat-label">🗓️ গত ৭ দিন</div>

    <form id="movie-form">

      <div class="form-group">

      <!-- Multiple Category Checkbox Grid -->
      <div class="form-group">
        <label>ক্যাটাগরি / Genre (একাধিক সিলেক্ট করুন):</label>
        <div class="category-checkbox-grid">
          <label class="cat-check-item"><input type="checkbox" value="Hindi Dub" class="cat-checkbox"> Hindi Dub</label>
          <label class="cat-check-item"><input type="checkbox" value="English Dub" class="cat-checkbox"> English Dub</label>
          <label class="cat-check-item"><input type="checkbox" value="Action" class="cat-checkbox"> Action</label>
          <label class="cat-check-item"><input type="checkbox" value="Romance" class="cat-checkbox"> Romance</label>
          <label class="cat-check-item"><input type="checkbox" value="Adventure" class="cat-checkbox"> Adventure</label>

          <label class="cat-check-item"><input type="checkbox" value="Adult 18+" class="cat-checkbox"> Adult 18+</label>
          <label class="cat-check-item"><input type="checkbox" value="Sci-Fi" class="cat-checkbox"> Sci-Fi</label>
          <label class="cat-check-item"><input type="checkbox" value="Supernatural" class="cat-checkbox"> Supernatural</label>
          <label class="cat-check-item"><input type="checkbox" value="Drama" class="cat-checkbox"> Drama</label>
          <label class="cat-check-item"><input type="checkbox" value="Comedy" class="cat-checkbox"> Comedy</label>

        </div>
      </div>

      <!-- Options: Verified Blue Tick, Pin to Top & Telegram Switch -->
      <div class="form-group" style="background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; display: flex; flex-direction: column; gap: 10px;">
        <label class="cat-check-item" style="color: #38bdf8; font-weight: bold;">

        </label>
        <label class="cat-check-item" style="color: #f59e0b; font-weight: bold;">
          <input type="checkbox" id="is-pinned"> 📌 Pin to Top (ইউজার প্যানেলে সবার উপরে পিন রাখুন)
        </label>
        
        <!-- Telegram Mode 3-Way Selection -->
        <div style="border-top: 1px solid #334155; padding-top: 8px;">
          <label style="color: #229ed9; font-weight: bold; margin-bottom: 4px;">✈️ Telegram Notification Mode:</label>
          <select id="telegram-mode" style="border-color: #229ed9;">
            <option value="ALWAYS">Always Enable (সবসময় টেলিগ্রামে নোটিফিকেশন যাবে)</option>
            <option value="ONCE">Send Once (শুধু এই পোস্টের জন্য যাবে, পরে বন্ধ হবে)</option>
            <option value="OFF" selected>OFF (টেলিগ্রামে কোনো মেসেজ পাঠাবে না)</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <div class="form-group" style="flex: 1;">
          <label>রেটিং (Rating)</label>
          <input type="text" id="rating" placeholder="⭐ 9.5">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>রিলিজ বছর (Year)</label>
          <input type="text" id="year" placeholder="2026">
        </div>
      </div>

      <div class="form-group">
        <label>অডিও ট্র্যাক / ভাষা (Audio Language)</label>
        <input type="text" id="language" placeholder="Hindi, Japanese, English">

      <div class="form-group">

      </div>

      <div class="form-group">
        <label>গল্প / বিবরণ (Synopsis)</label>

      <!-- Episode Box Section -->

        <div id="episodes-container"></div>
        <button type="button" class="btn-add-ep" onclick="addEpisodeBox()">+ নতুন এপিসোড বক্স যোগ করুন</button>
      </div>

      <button type="submit" id="submit-btn">Publish Anime</button>
      <button type="button" id="cancel-edit-btn" class="btn-cancel hidden" onclick="resetForm()">Cancel Editing</button>
    </form>

    <!-- Published Anime Items & Search -->
    <div class="movie-list">
      <h3 style="color: #38bdf8; margin-bottom: 8px;">🔍 পোস্ট করা এনিমেশন এডিট বা খুজুন</h3>
      
      <div id="total-post-count" class="total-posts-badge">সর্বমোট এনিমেশন পোস্ট: 0 টি</div>
      
      <input type="text" id="admin-search-input" class="admin-search-input" placeholder="এনিমেশনের নাম লিখে খুঁজুন..." oninput="filterAdminMovies()">
      
      <div id="movie-items"></div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    try {
      localStorage.setItem('isAdminDevice', 'true');
    } catch(e) { console.error(e); }

    const firebaseConfig = {
      apiKey: "AIzaSyBZPX85Wl0-vBE7Vm1NBuVoiBzVmp9xU0o",
      authDomain: "moviebox-6dca4.firebaseapp.com",
      databaseURL: "https://moviebox-6dca4-default-rtdb.firebaseio.com",
      projectId: "moviebox-6dca4",
      storageBucket: "moviebox-6dca4.firebasestorage.app",
      messagingSenderId: "573703773546",
      appId: "1:573703773546:web:04f01416cba5ff483ad913",
      measurementId: "G-1KR5NJ9T61"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // EXACT TELEGRAM BOT CREDENTIALS EMBEDDED
    const TELEGRAM_BOT_TOKEN = "8841045606:AAFmQGtoc7yylALdEyDFvOGCi72TVBl6MkY";
    const TELEGRAM_CHAT_ID = "@animedownloadweb";

    const SECRET_PASS = "arafat01721313101";
    let editingId = null;
    let moviesCache = {};
    let allAdminMoviesList = [];

    window.login = function() {
      const pass = document.getElementById('admin-pass').value;
      if (pass === SECRET_PASS) {
        localStorage.setItem('isAdminDevice', 'true');
        document.getElementById('login-section').classList.add('hidden');
        document.getElementById('admin-dashboard').classList.remove('hidden');
        loadMovies();
        loadAnalytics();
      } else {
        alert("ভুল পাসওয়ার্ড!");
      }
    };

    function loadAnalytics() {
      onValue(ref(db, 'analytics/liveUsers'), (snapshot) => {
        document.getElementById('stat-live').innerText = snapshot.exists() ? Object.keys(snapshot.val()).length : 0;
      });

      onValue(ref(db, 'analytics/totalViews'), (snapshot) => {
        document.getElementById('stat-total').innerText = snapshot.exists() ? snapshot.val() : 0;
      });

      onValue(ref(db, 'analytics/daily'), (snapshot) => {
        if (!snapshot.exists()) return;
        const data = snapshot.val();
        
        const now = new Date();
        const getFormattedDate = (d) => {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        };

        const todayStr = getFormattedDate(now);
        document.getElementById('stat-today').innerText = data[todayStr] || 0;

        let last7Total = 0;
        for(let i=0; i<7; i++) {
          const d = new Date();
          d.setDate(now.getDate() - i);
          const dateStr = getFormattedDate(d);
          last7Total += (data[dateStr] || 0);
        }
        document.getElementById('stat-7days').innerText = last7Total;

        let last30Total = 0;
        for(let i=0; i<30; i++) {
          const d = new Date();
          d.setDate(now.getDate() - i);
          const dateStr = getFormattedDate(d);
          last30Total += (data[dateStr] || 0);
        }
        document.getElementById('stat-30days').innerText = last30Total;
      });
    }

    // Advanced Auto Telegram Notification Logic
    function sendTelegramNotification(movieData, isEditMode, specificEpName) {
      const tgMode = document.getElementById('telegram-mode').value;
      if (tgMode === 'OFF' && !specificEpName) return;

      const cats = Array.isArray(movieData.category) ? movieData.category.join(', ') : movieData.category;
      let captionText = "";

      if (specificEpName) {
        captionText = `🔥 <b>NEW EPISODE RELEASED!</b> 🔥\n\n📌 <b>Anime:</b> ${movieData.title}\n🎉 <b>Episode:</b> ${specificEpName}\n🎙️ <b>Language:</b> ${movieData.language}\n🏷️ <b>Category:</b> ${cats}\n\n⬇️ <b>Download Episode Now:</b>\nhttps://limon11.github.io\n\n📢 <b>Join Channel:</b> ${TELEGRAM_CHAT_ID}`;
      } else if (isEditMode) {
        captionText = `🎬 <b>ANIME UPDATED!</b> 🎬\n\n📌 <b>Title:</b> ${movieData.title}\n⭐ <b>Rating:</b> ${movieData.rating} | <b>Year:</b> ${movieData.year}\n🎙️ <b>Language:</b> ${movieData.language}\n🏷️ <b>Category:</b> ${cats}\n\n⬇️ <b>Watch & Download Now:</b>\nhttps://limon11.github.io\n\n📢 <b>Join Channel:</b> ${TELEGRAM_CHAT_ID}`;
      } else {
        captionText = `🎬 <b>NEW ANIME UPLOADED!</b> 🎬\n\n📌 <b>Title:</b> ${movieData.title}\n⭐ <b>Rating:</b> ${movieData.rating} | <b>Year:</b> ${movieData.year}\n🎙️ <b>Language:</b> ${movieData.language}\n🏷️ <b>Category:</b> ${cats}\n\n✨ Watch & Download in HD Quality (480p, 720p, 1080p)\n\n⬇️ <b>Download Link:</b>\nhttps://limon11.github.io\n\n📢 <b>Join Channel:</b> ${TELEGRAM_CHAT_ID}`;
      }

      fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          photo: movieData.poster,
          caption: captionText,
          parse_mode: 'HTML'
        })
      })
      .then(res => res.json())
      .then(data => {
        console.log("Telegram Response:", data);
        if (tgMode === 'ONCE') {
          document.getElementById('telegram-mode').value = 'OFF';
        }
      })
      .catch(err => console.error("Telegram Post Error:", err));
    }

    window.generateAutoKeywords = function() {
      const title = document.getElementById('title').value.trim();
      if (!title) {
        alert("অনুগ্রহ করে আগে এনিমেশনের নাম (Title) লিখুন!");
        return;
      }
      const tLower = title.toLowerCase();
      const kwSet = [
        tLower,
        `${tLower} download`,
        `${tLower} hindi dubbed`,
        `${tLower} english subbed`,
        `${tLower} 480p 720p 1080p`,
        `${tLower} all episodes download`,
        `${tLower} direct download link`,
        `${tLower} watch online`,
        `${tLower} HD download`,
        `${tLower} anime download bd`
      ];

      document.getElementById('keywords').value = kwSet.join(', ');
      alert("⚡ ১০টি র‍্যাঙ্কিং SEO কিওয়ার্ড অটো-জেনারেট করা হয়েছে!");
    };

    window.addEpisodeBox = function(epName = "", isNew = false, epDate = "", qualities = [], notifyTg = false) {
      const container = document.getElementById('episodes-container');
      const epDiv = document.createElement('div');
      epDiv.className = 'ep-box';

      const defaultDate = epDate || "30/09/2026";
      const defaultName = epName || `Episode: 0${container.children.length + 1}`;

      epDiv.innerHTML = `
        <div class="ep-header-row">
          <input type="text" placeholder="এপিসোড নাম (যেমন: Episode: 01)" class="ep-name" value="${defaultName}" required>
          <label class="checkbox-label">
            <input type="checkbox" class="ep-is-new" ${isNew ? 'checked' : ''}> [New] Tag
          </label>
          <label class="checkbox-label tg-ep-label">
            <input type="checkbox" class="ep-notify-tg" ${notifyTg ? 'checked' : ''}> ✈️ Alert Telegram
          </label>
        </div>
        <div class="ep-header-row">
          <input type="text" placeholder="আপলোড তারিখ (যেমন: 30/09/2026)" class="ep-date" value="${defaultDate}">
        </div>
        
        <div class="quality-container">
          <label style="font-size:12px; color:#94a3b8; margin-bottom:5px;">ডাউনলোড লিংক ও কোয়ালিটিসমূহ:</label>
          <div class="qualities-list"></div>
          <button type="button" class="btn-add-q" onclick="addQualityRow(this)">+ কোয়ালিটি লিংক যোগ করুন</button>
        </div>
        
        <button type="button" class="btn-remove-ep" onclick="this.parentElement.remove()">🗑️ এই এপিসোড বক্স মুছুন</button>
      `;

      container.appendChild(epDiv);

      const qList = epDiv.querySelector('.qualities-list');
      if (qualities && qualities.length > 0) {
        qualities.forEach(q => addQualityRowDirect(qList, q.label, q.url));
      } else {
        addQualityRowDirect(qList, "480p x264 [Size: 120mb]", "");
        addQualityRowDirect(qList, "720p x264 [Size: 242mb]", "");
        addQualityRowDirect(qList, "1080p x265 [Size: 460mb]", "");
      }
    };

    window.addQualityRow = function(btn) {
      const qList = btn.previousElementSibling;
      addQualityRowDirect(qList, "", "");
    };

    function addQualityRowDirect(qListElement, labelVal = "", urlVal = "") {
      const qRow = document.createElement('div');
      qRow.className = 'quality-row';
      qRow.innerHTML = `
        <input type="text" placeholder="কোয়ালিটি/সাইজ (যেমন: 480p 120MB)" class="q-label" value="${labelVal}" required>
        <input type="url" placeholder="আসল ডাউনলোড লিংক" class="q-url" value="${urlVal}" required>
        <button type="button" class="btn-remove-q" onclick="this.parentElement.remove()">✕</button>
      `;
      qListElement.appendChild(qRow);
    }

    window.resetForm = function() {
      editingId = null;
      document.getElementById('movie-form').reset();
      document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
      document.getElementById('is-verified').checked = false;
      document.getElementById('is-pinned').checked = false;
      document.getElementById('telegram-mode').value = 'OFF';
      document.getElementById('submit-btn').innerText = "Publish Anime";
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('episodes-container').innerHTML = '';
      addEpisodeBox();
    };

    document.getElementById('movie-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const selectedCategories = [];
      document.querySelectorAll('.cat-checkbox:checked').forEach(cb => {
        selectedCategories.push(cb.value);
      });

      if (selectedCategories.length === 0) {
        alert("অনুগহ করে কমপক্ষে একটি ক্যাটাগরি সিলেক্ট করুন!");
        return;
      }

      const epBoxes = document.querySelectorAll('.ep-box');
      const episodes = [];
      let tgEpNotifyName = null;

      epBoxes.forEach(box => {
        const epName = box.querySelector('.ep-name').value;
        const isNew = box.querySelector('.ep-is-new').checked;
        const notifyTg = box.querySelector('.ep-notify-tg').checked;
        const epDate = box.querySelector('.ep-date').value || "30/09/2026";
        
        if (notifyTg && epName) {
          tgEpNotifyName = epName;
        }

        const qLabels = box.querySelectorAll('.q-label');
        const qUrls = box.querySelectorAll('.q-url');
        const qualities = [];

        qLabels.forEach((lbl, idx) => {
          if (lbl.value && qUrls[idx].value) {
            qualities.push({
              label: lbl.value,
              url: qUrls[idx].value
            });
          }
        });

        if (epName && qualities.length > 0) {
          episodes.push({
            episodeName: epName,
            isNew: isNew,
            date: epDate,
            qualities: qualities
          });
        }
      });

      const movieData = {
        type: document.getElementById('type').value,
        title: document.getElementById('title').value,
        poster: document.getElementById('poster').value,
        category: selectedCategories,
        isVerified: document.getElementById('is-verified').checked,
        isPinned: document.getElementById('is-pinned').checked,
        rating: document.getElementById('rating').value || "N/A",
        year: document.getElementById('year').value || "2026",
        language: document.getElementById('language').value || "Dual Audio",
        keywords: document.getElementById('keywords').value || "",
        synopsis: document.getElementById('synopsis').value || "",
        episodes: episodes,
        timestamp: Date.now()
      };

      const isEdit = !!editingId;

      if (editingId) {
        set(ref(db, 'movies/' + editingId), movieData).then(() => {
          sendTelegramNotification(movieData, isEdit, tgEpNotifyName);
          alert("সফলভাবে আপডেট করা হয়েছে!");
          resetForm();
        });
      } else {
        const newRef = push(ref(db, 'movies'));
        set(newRef, movieData).then(() => {
          sendTelegramNotification(movieData, false, tgEpNotifyName);
          alert("সফলভাবে পোস্ট করা হয়েছে!");
          resetForm();
        });
      }
    });

    function loadMovies() {
      onValue(ref(db, 'movies'), (snapshot) => {
        allAdminMoviesList = [];
        moviesCache = {};

        snapshot.forEach((child) => {
          const movie = child.val();
          const id = child.key;
          moviesCache[id] = movie;
          allAdminMoviesList.push({ id, ...movie });
        });

        allAdminMoviesList.sort((a, b) => {
          if ((b.isPinned ? 1 : 0) !== (a.isPinned ? 1 : 0)) {
            return (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0);
          }
          return (b.timestamp || 0) - (a.timestamp || 0);
        });

        document.getElementById('total-post-count').innerText = `সর্বমোট এনিমেশন পোস্ট: ${allAdminMoviesList.length} টি`;
        renderAdminList(allAdminMoviesList);
      });
    }

    window.filterAdminMovies = function() {
      const q = document.getElementById('admin-search-input').value.toLowerCase().trim();
      const filtered = allAdminMoviesList.filter(m => 
        m.title.toLowerCase().includes(q) ||
        (m.keywords && m.keywords.toLowerCase().includes(q))
      );
      renderAdminList(filtered);
    };

    function renderAdminList(list) {
      const itemsDiv = document.getElementById('movie-items');
      itemsDiv.innerHTML = "";

      if (list.length === 0) {
        itemsDiv.innerHTML = `<p style="color:#8b949e; text-align:center; padding:15px;">কোনো এনিমেশন খুঁজে পাওয়া যায়নি!</p>`;
        return;
      }

      list.forEach(movie => {
        const catDisplay = Array.isArray(movie.category) ? movie.category.join(', ') : (movie.category || '');
        const tickBadge = movie.isVerified ? `<span class="blue-tick" title="External Link Marked">✓</span>` : '';
        const pinBadge = movie.isPinned ? `<span class="pin-tag" title="Pinned to Top">📌</span>` : '';
        const posterUrl = movie.poster || 'https://i.ibb.co.com/ZpcSQ5d6/file-00000000ce2482118efd27c261ce5495.png';

        itemsDiv.innerHTML += `
          <div class="movie-item">
            <div class="admin-item-info">
              <strong>${movie.title}</strong> ${pinBadge} ${tickBadge} <br><small style="color:#38bdf8;">[${catDisplay}]</small>
            </div>
            <img src="${posterUrl}" alt="Poster" class="admin-thumb-img" onerror="this.onerror=null;this.src='https://i.ibb.co.com/ZpcSQ5d6/file-00000000ce2482118efd27c261ce5495.png';">
            <div class="action-btns">
              <button class="btn-bump" title="সবচেয়ে উপরে নিয়ে আসুন" onclick="bumpToTop('${movie.id}')">⬆️ Bump</button>
              <button class="btn-edit" onclick="editMovie('${movie.id}')">Edit</button>
              <button class="btn-delete" onclick="deleteMovie('${movie.id}')">Delete</button>
            </div>
          </div>
        `;
      });
    }

    window.bumpToTop = function(id) {
      update(ref(db, 'movies/' + id), {
        timestamp: Date.now()
      }).then(() => {
        alert("পোস্টটি সফলভাবে সবার উপরে নিয়ে আসা হয়েছে!");
      });
    };

    window.editMovie = function(id) {
      const movie = moviesCache[id];
      if (!movie) return;

      editingId = id;
      document.getElementById('type').value = movie.type || 'Anime Series';
      document.getElementById('title').value = movie.title || '';
      document.getElementById('poster').value = movie.poster || '';
      document.getElementById('is-verified').checked = !!movie.isVerified;
      document.getElementById('is-pinned').checked = !!movie.isPinned;
      document.getElementById('telegram-mode').value = 'OFF';

      document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
      if (movie.category) {
        let cats = Array.isArray(movie.category) ? movie.category : movie.category.split(',').map(s => s.trim());
        document.querySelectorAll('.cat-checkbox').forEach(cb => {
          if (cats.includes(cb.value) || (cb.value === "Adult 18+" && cats.includes("Ecchi/18+"))) {
            cb.checked = true;
          }
        });
      }

      document.getElementById('rating').value = movie.rating || '';
      document.getElementById('year').value = movie.year || '';
      document.getElementById('language').value = movie.language || '';
      document.getElementById('keywords').value = movie.keywords || '';
      document.getElementById('synopsis').value = movie.synopsis || '';

      const container = document.getElementById('episodes-container');
      container.innerHTML = '';
      
      if (movie.episodes && movie.episodes.length > 0) {
        movie.episodes.forEach(ep => {
          addEpisodeBox(ep.episodeName, ep.isNew, ep.date, ep.qualities, false);
        });
      } else if (movie.links && movie.links.length > 0) {
        addEpisodeBox("Episode: 01", false, "30/09/2026", movie.links, false);
      } else {
        addEpisodeBox();
      }

      document.getElementById('submit-btn').innerText = "Update Content (Bump to Top)";
      document.getElementById('cancel-edit-btn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteMovie = function(id) {
      if(confirm("সত্যিই মুছে ফেলতে চান?")) {
        remove(ref(db, 'movies/' + id));
      }
    };

    addEpisodeBox();
  </script>
</body>
  </html>
